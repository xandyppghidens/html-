<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança e Termos - Alexandre Air</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/padrao.css">
    <style>
        body { 
            background-color: rgb(165, 89, 18); 
            color: white; 
            font-family: sans-serif; 
            margin: 0;
        }

        .titulo-secao { 
            text-align: center; 
            padding: 25px; 
            color: rgb(12, 12, 12); 
            font-size: 1.4rem; 
            text-transform: uppercase; 
            font-weight: bold; 
        }

        .container-termos { padding: 20px; }

        /* --- SEÇÃO DE CHECKBOXES --- */
        .card-termos {
            background: #000;
            border: 2px solid gold;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-termos h2 { color: gold; font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .lista-termos { list-style: none; }

        .item-termo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            line-height: 1.2;
        }

        /* Estilizando o Checkbox */
        input[type="checkbox"] {
            accent-color: gold;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* --- FORMULÁRIO DE CONTATO --- */
        .form-contato {
            background: #000;
            border: 2px solid gold;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }

        label { color: gold; font-size: 0.9rem; font-weight: bold; }

        input[type="text"], input[type="email"], input[type="tel"], select {
            background: #111;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus { border-color: gold; }

        .btn-finalizar {
            background: gold;
            color: black;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-finalizar:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* --- MENU INFERIOR --- */
        .home { 
            width: 100%; 
            background: #000; 
            height: 100px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 2px solid gold;
        }
        .flui { width: 50px; transition: 0.3s; }
        
        footer { background-color: #000; padding: 30px 20px; text-align: justify; border-top: 3px solid gold; padding-top: 40px;}
        footer p { margin: 10px 0; color: #ccc; font-size: 0.9rem; }
        footer b { color: gold; }
    </style>
</head>
<body>

    <div class="titulo-secao">Políticas de Segurança</div>

    <section class="container-termos">
        
        <form action="#">
            <div class="card-termos">
                <h2>Confirmação de Segurança</h2>
                <div class="lista-termos">
                    <label class="item-termo"><input type="checkbox" required> Declaro que não levo objetos cortantes.</label>
                    <label class="item-termo"><input type="checkbox" required> Aceito a inspeção de bagagem de mão.</label>
                    <label class="item-termo"><input type="checkbox" required> Confirmo estar com documentos originais.</label>
                    <label class="item-termo"><input type="checkbox" required> Respeitarei os assentos marcados.</label>
                    <label class="item-termo"><input type="checkbox" required> Não transporto líquidos acima de 100ml.</label>
                    <label class="item-termo"><input type="checkbox" required> Estou ciente do horário do portão.</label>
                    <label class="item-termo"><input type="checkbox" required> Concordo com as taxas de excesso de peso.</label>
                    <label class="item-termo"><input type="checkbox" required> Declaro não portar substâncias ilícitas.</label>
                    <label class="item-termo"><input type="checkbox" required> Autorizo o uso de dados para o cartão VIP.</label>
                    <label class="item-termo"><input type="checkbox" required> Concordo com as políticas de reembolso.</label>
                    <label class="item-termo"><input type="checkbox" required> Aceito as normas da ANAC.</label>
                    <label class="item-termo"><input type="checkbox" required> Confirmo ser o titular da passagem.</label>
                    <label class="item-termo"><input type="checkbox" required> Declaro boa saúde para o voo.</label>
                    <label class="item-termo"><input type="checkbox" required> Concordo com todos os termos acima.</label>
                </div>
            </div>

            <div class="form-contato">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Digite seu nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" placeholder="email@alexandrevip.com" required>
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="tel" placeholder="(11) 99999-9999" required>
                </div>
                <div class="form-group">
                    <label>Assunto</label>
                    <select required>
                        <option value="">Selecione...</option>
                        <option value="duvida">Dúvida sobre Embarque</option>
                        <option value="bagagem">Problemas com Bagagem</option>
                        <option value="vip">Acesso Sala VIP</option>
                        <option value="outro">Outros Assuntos</option>
                    </select>
                </div>
                <button type="submit" class="btn-finalizar">Finalizar Termos</button>
            </div>
        </form>

    </section>

    <section class="home">
         <a href="index.html"> <img class="flui" src="imagem/casa.png" alt="Início"> </a>
         <a href="index2.html"> <img class="flui" src="imagem/viagem.png" alt="Voos"> </a>
         <a href="index3.html"> <img class="flui" src="imagem/mundo.png" alt="Operações"> </a>
         <a href="index4.html"> <img class="flui" src="imagem/ajuda.png" alt="Ajuda"> </a>
         <a href="index5.html"> <img class="flui" src="imagem/livro.png" alt="Segurança" style="filter: brightness(1.5); border-bottom: 2px solid gold;"> </a>
    </section>

    <footer>
        <p><b>Endereço:</b> Av. Paulista, 1000 - São Paulo/SP</p>
        <p><b>Telefone:</b> (11) 98765-4321</p>
        <p><b>E-mail:</b> contato@alexandrevip.com.br</p>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        <p>© 2026 Alexandre VIP - Todos os direitos reservados</p>
    </footer>

</body>
</html>
